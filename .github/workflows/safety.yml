name: Client safety tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install client
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
          python -m pip check
      - name: Verify release versions and tested dependency lock
        run: python tests/check_release.py
      - name: Check known dependency vulnerabilities
        run: |
          python -m venv .audit
          .audit/bin/python -m pip install pip-audit==2.10.1
          .audit/bin/pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Run synthetic safety tests without a funded wallet
        run: python -m unittest discover -s tests -v
      - name: Container packaging
        run: docker build --tag neurodynamic-mcp:test .
      - name: Offline container handshake
        run: python tests/container_smoke.py
