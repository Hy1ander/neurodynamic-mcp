[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodynamic-mcp"
version = "1.1.2"
description = "Audio, captions, documents and LLM APIs for agents with explicitly capped USDC purchases"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["mcp==2.2.0", "httpx==0.28.1", "x402[evm]==2.16.0", "aiohttp>=3.14.4", "certifi>=2026.10.18", "multidict>=6.9.1", "opentelemetry-api>=1.45.1", "PyJWT>=2.15.0", "urllib3>=2.8.0"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.urls]
Homepage = "https://x402.neurodynamic.tech/"
Documentation = "https://x402.neurodynamic.tech/integrations/mcp"
Support = "https://neurodynamic.tech/contact"

[project.scripts]
neurodynamic-mcp = "neurodynamic_mcp.server:main"

[tool.setuptools.packages.find]
include = ["neurodynamic_mcp*"]
